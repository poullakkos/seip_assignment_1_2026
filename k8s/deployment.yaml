apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  labels:
    app: echo-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-api
  template: 
    metadata:
      labels:
        app: echo-api
    spec:
      containers:
      - name: echo-api
        image: ghcr.io/poullakkos/echo-api:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: WELCOME_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: configmap
              key: WELCOME_MESSAGE
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: configmap
              key: NODE_ENV
        - name: API_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secret
              key: API_SECRET_KEY
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10